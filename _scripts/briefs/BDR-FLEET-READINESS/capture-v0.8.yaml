insert_sections:
- before_paragraph_starting_with: 3. Customer landscape
  paragraphs:
  - style: heading-2
    text: 2.6 The RAND tabletop exercise on battle damage repair
  - style: body
    text: In May 2026 RAND published the results of a tabletop exercise on repairing battle-damaged Arleigh Burke destroyers in a Pacific conflict. It is the most directly on-point public source in this brief, and it was sponsored by the Office of the Assistant Secretary of War for Sustainment.
  - style: body
    text: FACT. RAND conducted the exercise on 13 and 14 August 2025 with participants from the United States and allied Indo-Pacific nations, split into four groups representing the stakeholders who would be involved in repairs. It ran four vignettes in which ships, including DDG-51s, were damaged and required repair, and it examined the capabilities required, the implied command-and-control arrangements, partner nations’ roles, and the organic capabilities the Navy could deploy. [RAND RR-A470-9, 27 May 2026]
  - style: body
    text: FACT. RAND’s leading takeaway is that existing U.S. Navy systems for battle-damage repair are burdened by outdated peacetime frameworks and ambiguous command-and-control structures during conflict. It also found that the Navy’s organic repair capabilities are sufficient only for limited repairs to combat systems and for repairs that allow ships to transit back to the United States. [RAND RR-A470-9, 27 May 2026]
  - style: body
    text: FACT. Two of RAND’s five recommendations to the Navy bear directly on this brief. The Navy should institutionalize command and control by clarifying authority, streamlining communications and defining approval chains during crisis and conflict. And the Navy should expand organic repair capabilities and ensure that all deployed personnel are familiar with rapidly deploying those capabilities. A third recommends anchoring exercises to strategic objectives. [RAND RR-A470-9, 27 May 2026]
  - style: body
    text: Assessment. The coordination-seam argument in section 2.5 was an inference drawn from what the SWRMC keynote did not say. It is no longer an inference. RAND names ambiguous command and control as the leading problem, from an exercise with allied participants, in a peer-reviewed report paid for by an office of the Secretariat.
  - style: body
    text: Assessment, and it is the sharpest point in this brief. RAND recommends expanding organic repair capability and ensuring deployed personnel are familiar with rapidly deploying it, in a single sentence. SWRMC has built the capability. Fifty containers are pre-staged across the theater. The familiarity half is unaddressed, and the familiarity half is this product. The Navy is executing one half of a two-part recommendation.
  - style: body
    text: Assessment on method. RAND reached its conclusions by running a two-day tabletop exercise. The most authoritative public treatment of this problem used the technique this brief proposes to sell, once, to discover that the Navy is not ready. Discovery is not rehearsal. The commands that would actually execute the mission were not the ones in RAND’s room, and a finding published in a report does not transfer to a wardroom that has never made the decision under time pressure.
  - style: body
    text: Assessment on funding, and it is a lead rather than a conclusion. The study sponsor is the Office of the Assistant Secretary of War for Sustainment, Product Support office. Since the container mission itself is unfunded, an office that already paid for analysis of this exact problem is a more plausible first call than the fleet commands. Whether it has money for training rather than analysis is unknown, and nothing here supports a guess either way. Section 7 carries it as a Phase 1 target.
