  replace: '• Organizational Conflict of Interest, and it is sharper in this version. The direction of this research is informed in part by non-public knowledge of work at SRF-JRMC. None of that knowledge is cited anywhere in this brief, and every claim here traces to a public source. But SRF-JRMC is now named in the public record as the command coordinating the mission this product would serve, which makes the question harder rather than easier. CACI legal and contracts should close a review under Federal Acquisition Regulation Subpart 9.5 before any engagement with either command. This is a gate, not a parallel task. Separately, note that the acquisition organization itself is in motion: roughly 70 percent of systems-command functions and workforce are moving to Portfolio Acquisition Executives, maintenance and the public shipyards have moved to PAE Industrial Operations, and a comprehensive systems-command study is underway. Any office briefed now may not hold the decision when a task order is written, which is a further argument for keeping Phase 1 cheap.'
