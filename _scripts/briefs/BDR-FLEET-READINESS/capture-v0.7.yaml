# Capture brief v0.7 — recut around the SWRMC Pacific expeditionary maintenance
# container program surfaced in the MegaRust 2026 trip report (Robinson Day-3
# keynote, 4 June 2026). Two changes of substance and one of voice:
#
#   1. The demand case changes shape. v0.6 argued from budget testimony, journal
#      articles and adjacent DoD procurement precedent, and conceded no confirmed
#      Navy demand signal. v0.7 leads with a documented Navy operational mission
#      described publicly by the executive director of the command running it.
#   2. The opportunity is relocated. It is no longer "training assumptions
#      understate wartime damage." It is an undefined coordination seam between
#      two named commands on a live mission, plus the fact that the mission is
#      unfunded, which is treated as a risk rather than buried.
#   3. Voice. Removes the drafting tells: em-dash as default connector, stacked
#      hyphenated compound nouns, internal synthesis vocabulary in a
#      customer-facing document, and the process changelog on the cover.

