    Scaling logic — why a customer who buys Level 1 advances to Level 4-5. L1 and L2 are bespoke, hand-delivered scenario content built by analyst time per engagement; the cost per exercise is dominated by analyst labor, and the cost scales linearly with the number of exercises. L3-L5 introduce reusable scenario libraries and AI-driven scenario generation, where the cost per exercise drops sharply once a customer''s exercise cadence moves from "one-off" to "continuous fleet readiness" (a quarterly or higher rhythm across multiple wardrooms). The forcing function is exercise rhythm: at low rhythm L1-L2 is cheaper; at high rhythm L4-L5 is cheaper and L1-L2 cannot keep up. The proposal should frame the L1 pilot as a reference customer whose exercise rhythm tells CACI when to invest in the L3-L5 build-out, not as a standalone product.'
