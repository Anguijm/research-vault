- before_paragraph_starting_with: 3. Customer landscape
  paragraphs:
  - style: heading-2
    text: 2.5 The SWRMC Pacific expeditionary maintenance container program
  - style: body
    text: The strongest evidence in this brief came from the customer. On 4 June 2026 John Robinson, Executive Director of Southwest Regional Maintenance Center, gave the closing keynote at the MegaRust 2026 conference and described a Pacific battle damage repair program his command is running.
  - style: body
    text: FACT. Robinson stated that repair tenders for the surface force do not exist and that no tender plan exists for the foreseeable future. In their place SWRMC has pre-staged approximately 50 expeditionary maintenance containers across the Pacific theater for battle damage repair on surface ships. Containers either sit pre-positioned or move to an austere location, and are activated by SWRMC sailors and civilians flown out from San Diego. The program currently supports single-ship deployments of roughly two weeks. Robinson named Pat McDermott as the officer driving it. [MegaRust 2026 trip report, Day 3 keynote, 4 June 2026]
  - style: body
    text: FACT. Robinson stated that SWRMC sends project teams for contract oversight and works through Ship Repair Facility Japan Regional Maintenance Center, which he identified as the Area Maintenance Commander in the Western Pacific, to support the container deployments. [MegaRust 2026 trip report, Day 3 keynote, 4 June 2026]
  - style: body
    text: FACT. Robinson stated that the mission is unfunded. [MegaRust 2026 trip report, Day 3 keynote, 4 June 2026]
  - style: body
    text: 'Assessment. Three things follow. The demand for wartime repair capability in the Pacific is no longer an inference drawn from budget testimony and journal articles, because a command has built a physical program and said so on the record. The customer set this brief already proposed turns out to be the customer set actually running the mission, which removes a step from the engagement plan. And the opening the product addresses is now visible: the division of work between SWRMC and SRF-JRMC on the container mission, and on the related battle damage exercises, was not described in the keynote and does not appear in any public source. Two commands are coordinating a wartime repair mission whose boundaries are undefined. Rehearsing those decisions before a shooting war is the product this brief proposes.'
  - style: body
    text: Assessment, and it cuts against the opportunity. An unfunded mission has no money to buy training. The organization most likely to want this product is the one least able to pay for it today. That does not make the opportunity false, but it moves the central question from whether the Navy needs this to whose budget would carry it. Section 8.6 treats that as a risk rather than a footnote.
- before_paragraph_starting_with: 9. Business Development team next actions
  paragraphs:
  - style: heading-2
    text: 8.6 The mission that needs this product is unfunded
  - style: body
    text: Robinson described the container program as unfunded. A program with no money cannot issue a task order however much it wants the capability. Any pursuit therefore has to identify whose budget would carry decision-rehearsal training. Candidates are the fleet commander who owns the readiness requirement, the type commander, a research and development line, or an existing training contract with room in scope. The discovery engagement in section 7 should treat the funding question as the first thing to learn, ahead of technical scope and ahead of scenario design. If Phase 1 cannot name a plausible payer, the correct answer is to stop.
