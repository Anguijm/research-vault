insert_sections:
- before_paragraph_starting_with: 3. Customer landscape
  paragraphs:
  - style: heading-2
    text: '2.7 What the sources do not establish: who owns this mission'
  - style: body
    text: Earlier versions of this brief said SWRMC and SRF-JRMC were running the container mission. That went further than the evidence, and the correction matters because the over-claim quietly contradicted the argument the brief is built on.
  - style: body
    text: What the sources support. SWRMC built and pre-staged the containers. SWRMC sends project teams out for contract oversight. SWRMC works through SRF-JRMC, which Robinson identified as the Area Maintenance Commander in the Western Pacific. Pat McDermott drives the program and Robinson did not describe his organizational position. The mission is unfunded.
  - style: body
    text: 'What they do not support. That either command owns the mission. A command that builds a capability and deploys teams into another command’s area is a visible executor, not necessarily the owner. Several other organizations plausibly hold a piece and are absent from the public record on this: Commander, Navy Regional Maintenance Center as the parent of the RMCs, NAVSEA 04 at the systems-command level, the fleet commander who would own the readiness requirement, MARMC on the Atlantic side, and whoever owns the Expeditionary Mobile Repair Facility concept that RAND recommends. SWRMC is simply the piece that gave a public keynote.'
  - style: body
    text: Assessment, and this strengthens the case rather than weakening it. RAND’s leading finding is that command-and-control structures for battle damage repair are ambiguous. A brief that then names the owner would be contradicting its own central source. The honest reading is that the public record shows a capability being built, a theater command coordinating it, an unfunded mission, and no discernible owner. That is what ambiguous command and control looks like from the outside.
  - style: body
    text: Consequence for engagement. Phase 1 cannot open by pitching the mission owner, because nobody outside can identify one. It opens by establishing who owns the decisions, which is a question the customer will recognize as real and which the product exists to rehearse. If discovery finds a clear owner, the brief was too cautious and the engagement gets simpler. If it finds the seam RAND describes, that is the sale.
