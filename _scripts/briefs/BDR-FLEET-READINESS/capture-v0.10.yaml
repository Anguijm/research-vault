insert_sections:
- before_paragraph_starting_with: 3. Customer landscape
  paragraphs:
  - style: heading-2
    text: '2.8 The ambiguity runs higher than the theater: the PAE restructuring and the systems-command study'
  - style: body
    text: Section 2.7 says no public source establishes who owns the Pacific container mission. That is not an oversight in the reporting. The organization that would hold industrial ownership of battle damage repair is being taken apart and rebuilt right now.
  - style: body
    text: FACT. The Navy is moving functions and workforce out of its systems commands into new Portfolio Acquisition Executives. The principal military deputy to the Assistant Secretary of the Navy for Research, Development and Acquisition said in March 2026 that about 70 percent of the functions and the workforce at systems commands like NAVSEA will transfer to the PAEs, with the systems command continuing in engineering, technical expertise and infrastructure while a large portion of the workforce and the mission authorities realign under the PAEs. [USNI News, 20 July 2026]
  - style: body
    text: FACT. PAE Industrial Operations is led by Vice Adm. Jim Downey, who also heads NAVSEA, and oversees maintenance and the public shipyards. PAE Maritime reached initial operating capability on a 16 July 2026 memo under Chris Miller and runs five deputy portfolios, one of which is Ship Readiness, led by Rear Adm. Andy Biehn with Lisa Bonacic-Doric, covering maintenance for combatants, the Arleigh Burke–class DDG 2.0 modification, training systems and international support. [USNI News, 20 July 2026]
  - style: body
    text: FACT. A spokesperson for the Assistant Secretary of the Navy for Research, Development and Acquisition told USNI News that a comprehensive Navy Systems Command study is underway and that the study will inform the future roles and compositions of the systems commands. [USNI News, 20 July 2026]
  - style: body
    text: Assessment. RAND found command and control for battle damage repair ambiguous inside a wartime exercise. This is the peacetime organization above it, and it is unsettled on the record, with a study running to decide what the systems commands become. Read together, the two say the same thing at different altitudes. This brief is not describing a gap that someone simply has not gotten to. It is describing a period in which ownership is genuinely undetermined.
  - style: body
    text: Assessment, and it corrects this brief. Earlier versions named NAVSEA 04 as a systems-command contracting authority. Maintenance and the public shipyards now sit under PAE Industrial Operations. NAVSEA continues to hold engineering and technical expertise, so NAVSEA 05 remains the right reference for the data-bridge question in section 5.3, but NAVSEA 04 should not be presented as the buying authority without qualification.
  - style: body
    text: Assessment, and it is the most actionable line in this section. PAE Maritime’s Ship Readiness portfolio holds maintenance for combatants and training systems together. That is the intersection this product occupies, it has named leadership, and it is new enough that its processes and vehicles are being set now rather than defended. It belongs on the Phase 1 call list alongside the study sponsor named in section 2.6.
  - style: body
    text: 'Assessment on timing, and it cuts both ways. Selling into an organization mid-reorganization is hard in a specific way: reporting lines move, budgets are re-pointed, and the office briefed today may not hold the decision tomorrow. Against that, a new organization has to decide how it buys, and a defined product arriving while those decisions are being made can land better than one arriving after they harden. Section 8.7 carries the risk side.'
- before_paragraph_starting_with: 9. Business Development team next actions
  paragraphs:
  - style: heading-2
    text: 8.7 The acquisition organization is being rebuilt mid-pursuit
  - style: body
    text: About 70 percent of the functions and workforce at systems commands like NAVSEA are moving to the Portfolio Acquisition Executives, maintenance and the public shipyards have moved to PAE Industrial Operations, and a comprehensive systems-command study is underway that will inform the future roles and compositions of the systems commands. Any engagement plan written now is aimed at a moving target. The specific failure mode is briefing an office that loses the decision authority before a task order can be written, which burns the relationship and the calendar. Mitigation is to confirm at each Phase 1 meeting who will hold the decision after the study concludes, and to treat any answer given today as provisional. This is also an argument for keeping Phase 1 cheap, since the cost of a wasted meeting is low and the cost of a wasted proposal is not.
