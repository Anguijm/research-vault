insert_sections:
- before_paragraph_starting_with: • Senior leadership is funding the problem.
  paragraphs:
  - style: bullet
    text: A Navy command is running the mission today and said so in public. John Robinson, Executive Director of SWRMC, described the container program at the MegaRust 2026 conference on 4 June 2026. Tenders for the surface force do not exist and are not planned, so SWRMC pre-staged the containers as the substitute. Pat McDermott drives the program. SWRMC sends project teams out for contract oversight and works through SRF-JRMC in its Area Maintenance Commander role. This is the customer describing the requirement rather than an analyst inferring it.
- before_paragraph_starting_with: • Keep an alternative entry ready through the Defense Innovation Unit
  paragraphs:
  - style: bullet
    text: 'Find the payer before designing anything. Robinson said the container mission is unfunded, so the organization most likely to want this product is the one least able to buy it. Phase 1 should establish whose budget could carry it: the fleet commander who owns the readiness requirement, the type commander, a research and development line, or an existing training contract with room in scope. If Phase 1 cannot name a plausible payer, stop there and say so.'
