- before_paragraph_starting_with: • A Navy command is running the mission today
  paragraphs:
  - style: bullet
    text: An independent federally sponsored study says the gap is command and control. RAND ran a two-day tabletop exercise in August 2025 with U.S. and allied Indo-Pacific participants and published the results in May 2026 (RR-A470-9). Its leading takeaway is that Navy battle-damage-repair systems carry outdated peacetime frameworks and ambiguous command-and-control structures into conflict, and that organic repair capability is sufficient only for limited repairs and for getting a ship home. Two of its five Navy recommendations are to institutionalize command and control, and to expand organic repair capability while ensuring deployed personnel are familiar with rapidly deploying it.
