- find: 'The Navy has no repair tenders for its surface fleet and no near-term plan to build any. Southwest Regional Maintenance Center (SWRMC) has built a substitute: roughly 50 expeditionary maintenance containers pre-staged across the Pacific for battle damage repair, activated by sailors and civilians flown out from San Diego. On 4 June 2026 the command''s executive director described the program in a public conference keynote, identified Ship Repair Facility Japan Regional Maintenance Center (SRF-JRMC) as the Area Maintenance Commander coordinating the deployments, and said the mission is unfunded. The materiel is being positioned. The decisions that would route a damaged ship to it have not been rehearsed, and the division of responsibility between the two commands has not been made public. That seam is the opportunity.'
  replace: Two independent sources seven weeks apart describe the same problem from opposite ends. In May 2026 RAND published the results of a two-day tabletop exercise on repairing battle-damaged Arleigh Burke destroyers in a Pacific conflict; its leading finding was that Navy battle-damage-repair systems are burdened by outdated peacetime frameworks and ambiguous command-and-control structures. In June 2026 the Executive Director of Southwest Regional Maintenance Center (SWRMC) told an industry conference that the Navy has no repair tenders for the surface fleet and no plan to build any, so his command has pre-staged roughly 50 expeditionary maintenance containers across the Pacific as the substitute. He named Ship Repair Facility Japan Regional Maintenance Center (SRF-JRMC) as the Area Maintenance Commander coordinating the deployments, and said the mission is unfunded. RAND recommends the Navy expand organic repair capability and ensure deployed personnel are familiar with rapidly deploying it. The Navy is doing the first half. The second half is this product.
